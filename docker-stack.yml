# ============================================
# Docker Swarm Stack Definition
# ============================================
# Level 3: Container Orchestration with Docker Swarm
# ============================================
# Build images first:
#   docker build -t taskflow-backend:latest ./backend
#   docker build -t taskflow-frontend:latest ./frontend
#   docker build -t taskflow-worker:latest ./worker
#
# Deploy with: docker stack deploy -c docker-stack.yml taskflow
# ============================================

version: "3.9"

x-common-variables: &common-variables
  DB_HOST: database
  DB_PORT: 3306
  DB_NAME: taskflow
  DB_USER: taskflow
  DB_PASSWORD: taskflow123
  CORS_ORIGIN: "*"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  NODE_ENV: production

services:
  # ============================================
  # Frontend Service
  # ============================================
  frontend:
    image: taskflow-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - taskflow
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Nginx Load Balancer
  # ============================================
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - taskflow
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - backend1
      - backend2
      - backend3

  # ============================================
  # Backend Replicas (3 separate services for Swarm load balancing)
  # Note: Each service has 1 replica, total 3 instances
  # ============================================
  backend1:
    image: taskflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *common-variables
      INSTANCE_ID: "backend-1"
    networks:
      - taskflow
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy

  backend2:
    image: taskflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *common-variables
      INSTANCE_ID: "backend-2"
    networks:
      - taskflow
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy

  backend3:
    image: taskflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *common-variables
      INSTANCE_ID: "backend-3"
    networks:
      - taskflow
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy

  # ============================================
  # Redis Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - taskflow
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Worker Service (Async Processing)
  # ============================================
  worker:
    image: taskflow-worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - taskflow
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    depends_on:
      redis:
        condition: service_healthy

  # ============================================
  # MySQL Database
  # ============================================
  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: taskflow123
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow123
    networks:
      - taskflow
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptaskflow123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  taskflow:
    driver: overlay
    attachable: true

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
